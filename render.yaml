databases:
  - name: psikonutrisense-db
    plan: free
    databaseName: psikonutrisense_db
    user: psikonutrisense

services:
  - type: web
    name: psikonutrisense-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: Psikonutrisense
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: psikonutrisense-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: psikonutrisense-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: psikonutrisense-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: psikonutrisense-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: psikonutrisense-db
          property: password
